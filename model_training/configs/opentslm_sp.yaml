architecture: soft_prompt
base_model: meta-llama/Llama-3.2-1B
warm_start: OpenTSLM/llama-3.2-1b-har-sp
upstream_commit: 2968f4b891baab4307f7e9d0043e87677b593a30
precision: bfloat16
batch_size: 2
gradient_accumulation_steps: 8
epochs: 3
early_stopping_patience: 3
max_wall_time_hours: 3.0
training:
  max_examples: 8192
learning_rates:
  encoder: 0.0002
  projector: 0.0001
  lora: 0.00002
lora:
  rank: 16
  alpha: 32
  dropout: 0.0
validation:
  at_start: true
  every_steps: 50
  every_epoch: true
  batch_size: 4
  loss_subset: 128
  generation_subset: 48
  zero_signal_subset: 12
observability:
  tensorboard: true
  jsonl: true
  log_every_steps: 10
  sample_generations_every_steps: 250
  gpu_metrics_every_seconds: 10
  wandb:
    enabled: true
    project: robot-observability
    entity: null
    log_adapter_artifact: true
